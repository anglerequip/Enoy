<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="enoy-token" content="__ENOY_TOKEN__">
<title>Enoy</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<script src="/static/theme-boot.js"></script>
<script src="/static/appearance.js"></script>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sb-head">
      <div class="brand"><img class="brand-mark" src="/static/logo.svg" alt=""> Enoy</div>
      <div class="mode-switch" id="mode-switch" role="tablist" aria-label="Mode">
        <button role="tab" data-action="mode" data-mode="chat" title="Chat" aria-label="Chat"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span>Chat</span></button>
        <button role="tab" data-action="mode" data-mode="code" title="Code" aria-label="Code"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 4l-3 16"/></svg><span>Code</span></button>
      </div>
      <button class="icon-btn" data-action="toggle-sidebar" title="Hide sidebar" aria-label="Hide sidebar"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    </div>
    <div id="mode-caption" class="mode-caption"></div>
    <button class="new-chat primary-nav" data-action="new-chat" title="New chat (Ctrl+Shift+N)"><span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span> New chat</button>
    <button class="new-chat sb-nav" data-action="nav-projects" data-nav="projects"><span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span> Projects</button>
    <button class="new-chat sb-nav" data-action="nav-artifacts" data-nav="artifacts"><span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></span> Artifacts</button>
    <button class="new-chat sb-activity" data-action="toggle-activity" title="What each model is doing (Ctrl+Shift+A)"><span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></span> Activity</button>
    <div id="project-switch"></div>
    <nav id="chat-list"></nav>
    <div class="sb-foot">
      <div id="status-line" aria-label="AI providers"></div>
      <button class="provider-settings" data-action="token-savings"><span aria-hidden="true">↗</span> Estimated token savings</button>
      <button class="provider-settings" data-action="open-settings"><span aria-hidden="true">⚙</span> Settings</button>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button class="icon-btn" data-action="toggle-sidebar" id="show-sidebar" title="Show sidebar" aria-label="Show sidebar"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      <div id="chat-menu"></div>
      <span id="mode-indicator" class="mode-indicator"></span>
      <div class="grow"></div>
      <button class="icon-btn text" data-action="toggle-files" id="files-btn" title="Project files"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5A1.5 1.5 0 0 1 5.5 5H10l2 2h6.5A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/></svg>Files</button>
      <button class="icon-btn text" data-action="toggle-activity" id="activity-btn" title="Activity: what each model is doing (Ctrl+Shift+A)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity</button>
    </header>
    <div id="workspace-context" class="workspace-context hidden"></div>
    <div id="scroll"><div id="thread" class="col"></div></div>
    <div id="composer-wrap" class="col"></div>
  </main>

  <aside id="drawer" class="hidden"></aside>
  <aside id="activity" class="hidden" aria-label="Activity"></aside>
  <aside id="artifact" class="hidden" aria-label="Artifact"></aside>
</div>
<div id="menu" class="menu hidden"></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/static/markdown.js"></script>
<script src="/static/app.js"></script>
<script src="/static/activity.js"></script>
<script src="/static/projects.js"></script>
<script src="/static/pcsettings.js"></script>
<script src="/static/winframe.js"></script>
</body>
</html>
