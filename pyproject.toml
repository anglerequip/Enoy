[project]
name = "enoy"
version = "0.3.1"
description = "Enoy: ChatGPT-led development with Codex, Claude."
requires-python = ">=3.11"
dependencies = ["pywebview==5.4"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
enoy = "enoy.app:main"

[tool.pytest.ini_options]
norecursedirs = ["retired"]
testpaths = ["tests"]
markers = [
    "integration: talks to the real local Ollama service (skipped when it is not running)",
]
addopts = "-ra"
