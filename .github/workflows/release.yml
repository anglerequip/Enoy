name: Windows desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Install installer compiler
        run: choco install innosetup --version=6.7.3 --yes --no-progress
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c 'from enoy import __version__; print(__version__)'
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version must match.' }
      - name: Build Windows installer
        shell: pwsh
        run: ./launch/build-release.ps1 -Iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - name: Smoke test packaged runtime
        run: python launch/smoke-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Enoy-Windows
          path: |
            dist/Enoy-Setup-x64.exe
            dist/Enoy-Setup-x64.exe.sha256
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Enoy-Windows
          path: release
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --title "Enoy $RELEASE_TAG" --generate-notes
          fi
