name: Windows desktop release
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - name: Set automatic release version
        id: version
        shell: pwsh
        run: |
          $version = "0.6.$env:GITHUB_RUN_NUMBER"
          $tag = "v$version"
          Set-Content -LiteralPath 'enoy/_release_version.py' -Value "__version__ = `"$version`"" -Encoding ascii
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Building stable release $tag for $env:GITHUB_SHA"
      - name: Test
        run: python -m pytest -q
      - name: Install installer compiler
        run: choco install innosetup --version=6.7.3 --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: ./launch/build-release.ps1 -Iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - name: Smoke test packaged runtime
        run: python launch/smoke-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Enoy-Windows
          path: |
            dist/Enoy-Setup-x64.exe
            dist/Enoy-Setup-x64.exe.sha256
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Enoy-Windows
          path: release
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --target "$RELEASE_TARGET" --title "Enoy $RELEASE_VERSION" --notes "Automatic stable Windows release from main commit $RELEASE_TARGET."
          fi
