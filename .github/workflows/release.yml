name: Windows desktop release
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - name: Set automatic release version
        id: version
        shell: pwsh
        run: |
          $version = "0.6.$env:GITHUB_RUN_NUMBER"
          $tag = "v$version"
          Set-Content -LiteralPath 'enoy/_release_version.py' -Value "__version__ = `"$version`"" -Encoding ascii
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Building stable release $tag for $env:GITHUB_SHA"
      - name: Test
        # Offline checks only; do not run tests that exercise Claude.
        run: >-
          python -m pytest -q
          tests/test_appearance.py tests/test_codex_discovery.py tests/test_commands.py
          tests/test_markdown_js.py tests/test_project.py tests/test_redact.py
          tests/test_updates.py tests/test_virtual_chat_project.py tests/test_winshell.py
          tests/test_usage.py::test_savings_only_completed_requests
          tests/test_server.py::test_latest_release_notes_route_returns_release_metadata
          tests/test_server.py::test_chat_attachment_upload_is_bounded_and_stays_in_project
      - name: Install installer compiler
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: ./launch/build-release.ps1 -Iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - name: Smoke test packaged runtime
        run: python launch/smoke-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Enoy-Windows
          path: |
            dist/Enoy-Setup-x64.exe
            dist/Enoy-Setup-x64.exe.sha256
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Enoy-Windows
          path: release
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            previous_tag=$(gh release list --repo "$GH_REPO" --limit 1 --json tagName --jq '.[0].tagName')
            changes=$(gh api "repos/$GH_REPO/compare/$previous_tag...$RELEASE_TARGET" --jq '[.commits[] | .commit.message | split("\n")[0]] | unique | .[]')
            {
              echo "### What's changed"
              if [ -n "$changes" ]; then
                while IFS= read -r line; do printf -- '- %s\n' "$line"; done <<< "$changes"
              else
                echo "- Maintenance and fixes in this Enoy release."
              fi
              echo
              printf '[Full changelog](https://github.com/%s/compare/%s...%s)\n' "$GH_REPO" "$previous_tag" "$RELEASE_TARGET"
            } > release-notes.md
            gh release create "$RELEASE_TAG" release/* --target "$RELEASE_TARGET" --title "Enoy $RELEASE_VERSION" --notes-file release-notes.md
          fi
